name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Install Linux dependencies
        if: runner.os == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Run unit tests
        run: cargo test -p modernboot-shared -p modernboot-installer

      - name: Build UEFI bootloader (x86_64-unknown-uefi)
        run: cargo build -p modernboot-efi --target x86_64-unknown-uefi --release

      - name: Build Desktop App
        run: cargo build -p modernboot-app --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modernboot-${{ runner.os }}
          path: |
            target/x86_64-unknown-uefi/release/modernboot-efi.efi
            target/release/modernboot-app*
